[project]
name = "qwen-vae-triton"
version = "0.2.0"
description = "Quality-focused Triton W8A8 implicit-GEMM Conv3D acceleration for the Qwen-Image/Wan VAE in ComfyUI, optimized for faster first workflow runs and resolution changes. PuppetVisionAI: https://www.youtube.com/@PuppetVisionAI | LinkedIn: https://www.linkedin.com/in/allen-b-3a35505a/ | Website: https://puppetvision.nl"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Project contributors" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: POSIX :: Linux",
  "Environment :: GPU :: AMD ROCm",
]

[project.urls]
Repository = "https://github.com/AllenCraigBarnard/ComfyUI-Qwen-VAE-Triton"
"Bug tracker" = "https://github.com/AllenCraigBarnard/ComfyUI-Qwen-VAE-Triton/issues"

[tool.comfy]
PublisherId = "puppet-vision"
DisplayName = "Qwen VAE Triton W8A8"
Icon = "https://raw.githubusercontent.com/AllenCraigBarnard/ComfyUI-Qwen-VAE-Triton/main/assets/logo.png"
